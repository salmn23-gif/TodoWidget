name: Build exe
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: copy todo_widget.pyw todo_widget_build.py
      - run: pyinstaller --noconsole --onefile --name TodoWidget todo_widget_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: TodoWidget
          path: dist/TodoWidget.exe
